<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Fire Speedometer</title>
    <style>
        /* Embed Orbitron & Rajdhani as base64 fallback not needed — using system fonts as fallback */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap');
    </style>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div id="hud" class="hidden">

    <!-- Top bar: Engine / Selt / Lights -->
    <div class="top-bar">
        <div class="top-btn">
            <span class="top-dot" id="dot-engine"></span>
            ENGINE <span id="lbl-engine" class="lbl-val on">ON</span>
        </div>
        <div class="top-divider"></div>
        <div class="top-btn">
            <span class="top-dot red" id="dot-selt"></span>
            SELT <span id="lbl-selt" class="lbl-val off">OFF</span>
        </div>
        <div class="top-divider"></div>
        <div class="top-btn">
            <span class="top-dot yellow"></span>
            LIGHTS <span id="lbl-lights" class="lbl-val on">On</span>
        </div>
    </div>

    <!-- Middle: Logo + Speed -->
    <div class="mid-section">

        <!-- Left: RPM circle -->
        <div class="rpm-circle-wrap">
            <svg class="rpm-svg" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer glow ring -->
                <circle cx="45" cy="45" r="38" fill="none" stroke="rgba(255,60,0,0.15)" stroke-width="6"/>
                <!-- BG track -->
                <circle cx="45" cy="45" r="30" fill="none" stroke="rgba(40,10,0,0.8)" stroke-width="8"
                        stroke-dasharray="188.5" stroke-dashoffset="0"
                        transform="rotate(-210 45 45)"/>
                <!-- Active RPM arc -->
                <circle id="rpm-arc" cx="45" cy="45" r="30" fill="none"
                        stroke="url(#rpmGrad)" stroke-width="8" stroke-linecap="round"
                        stroke-dasharray="188.5" stroke-dashoffset="188.5"
                        transform="rotate(-210 45 45)"/>
                <defs>
                    <linearGradient id="rpmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%"   stop-color="#ff2200"/>
                        <stop offset="60%"  stop-color="#ff6600"/>
                        <stop offset="100%" stop-color="#ffdd00"/>
                    </linearGradient>
                </defs>
                <!-- Fire icon center -->
                <text x="45" y="52" text-anchor="middle" font-size="22" fill="none"
                      stroke="rgba(255,80,0,0.2)" stroke-width="1">🔥</text>
                <text x="45" y="52" text-anchor="middle" font-size="20">🔥</text>
            </svg>
        </div>

        <!-- Right: Name tag + speed -->
        <div class="speed-section">
            <div class="brand-tag">FIRE</div>
            <div class="speed-num-wrap">
                <span id="speed-val" class="speed-num">0</span>
            </div>
            <div class="speed-unit-row">
                <span id="btn-mph" class="unit-btn active" onclick="setUnit('MPH')">MPH</span>
                <span class="unit-sep">/</span>
                <span id="btn-kph" class="unit-btn" onclick="setUnit('KPH')">KPH</span>
            </div>
        </div>

    </div>

    <!-- RPM text -->
    <div class="rpm-text-row">
        <span class="rpm-label">RPM</span>
        <span id="rpm-val" class="rpm-val">0 RPM</span>
    </div>

    <!-- Bottom info: Gear / Fuel / Health -->
    <div class="bottom-bar">

        <!-- Gear -->
        <div class="info-box gear-box">
            <div class="info-title">GEAR</div>
            <div id="gear-val" class="gear-num">1</div>
        </div>

        <!-- Fuel -->
        <div class="info-box fuel-box">
            <div class="info-title">⛽ FUEL</div>
            <div class="bar-track">
                <div id="fuel-fill" class="bar-inner fuel-color"></div>
            </div>
            <div id="fuel-pct" class="info-pct">100%</div>
        </div>

        <!-- Health -->
        <div class="info-box health-box">
            <div class="info-title">❤ HEALTH</div>
            <div class="bar-track">
                <div id="health-fill" class="bar-inner health-color"></div>
            </div>
            <div id="health-pct" class="info-pct">100%</div>
        </div>

    </div>

    <!-- ODO -->
    <div class="odo-row">
        <span class="odo-icon">📍</span>
        <span class="odo-label">ODO</span>
        <span id="odo-val" class="odo-val">0.0 Miles</span>
    </div>

    <!-- Boost flash -->
    <div id="boost-flash" class="boost-flash">🔥 BOOST!</div>

    <!-- Flame particles -->
    <div class="flame-container">
        <div class="fp fp1"></div>
        <div class="fp fp2"></div>
        <div class="fp fp3"></div>
        <div class="fp fp4"></div>
        <div class="fp fp5"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
